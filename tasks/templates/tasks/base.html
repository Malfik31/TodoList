<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Задачи{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7384;
      --line: #e2e5ea; --accent: #2f5fd0; --danger: #c93b3b; --ok: #2e8b57;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #15181f; --card: #1e232c; --text: #e8eaee; --muted: #959cab;
        --line: #2f3541; --accent: #6b93f0; --danger: #ef6b6b; --ok: #5cc48a;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; margin: 0; }
    a { color: var(--accent); }
    .btn { display: inline-block; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--card); color: var(--text); font: inherit; cursor: pointer; text-decoration: none; }
    .btn:hover { border-color: var(--accent); }
    .btn:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-danger { color: var(--danger); }
    .btn-sm { padding: 4px 10px; font-size: .875rem; }
    .msg { padding: 10px 14px; border-radius: 6px; background: var(--card);
           border-left: 4px solid var(--ok); margin-bottom: 16px; }
    .task { display: flex; gap: 12px; align-items: flex-start; background: var(--card);
            border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
    .task-body { flex: 1; min-width: 0; }
    .task-title { font-weight: 600; }
    .task.done .task-title { text-decoration: line-through; color: var(--muted); }
    .task-desc { color: var(--muted); font-size: .9rem; white-space: pre-line; }
    .task-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .empty { color: var(--muted); text-align: center; padding: 40px 0; }
    form p { margin: 0 0 14px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input[type=text], textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line);
           border-radius: 6px; background: var(--card); color: var(--text); font: inherit; }
    .errorlist { color: var(--danger); list-style: none; padding: 0; margin: 0 0 4px; font-size: .875rem; }
    .topbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px;
              font-size: .875rem; color: var(--muted); margin-bottom: 16px; flex-wrap: wrap; }
    .topbar form { margin: 0; }
    .badge { font-size: .75rem; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line); }
    .auth-links { margin-top: 16px; color: var(--muted); }
    .helptext { color: var(--muted); font-size: .8rem; display: block; }
    input[type=password], input[type=email], input[type=text] { width: 100%; padding: 8px 10px;
           border: 1px solid var(--line); border-radius: 6px; background: var(--card);
           color: var(--text); font: inherit; }
  </style>
</head>
<body>
  <div class="wrap">
    {% if user.is_authenticated %}
    <div class="topbar">
      <span>{{ user.username }}{% if user.is_staff %} <span class="badge">админ</span>{% endif %}</span>
      {% if user.is_staff %}<a href="{% url 'admin:index' %}">Админка</a>{% endif %}
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="btn btn-sm" type="submit">Выйти</button>
      </form>
    </div>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
